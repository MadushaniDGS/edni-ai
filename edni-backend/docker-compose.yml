version: "3.9"

services:

  # ── FastAPI Backend ──────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: edni_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://edni:edni_pass@localhost:5432/edni_db
      - REDIS_URL=redis://redis:6379/0
      - MONGODB_URL=mongodb://mongo:27017
      - MONGODB_DB=edni_logs
      - GROQ_API_KEY=${GROQ_API_KEY}
      - PINECONE_API_KEY=${PINECONE_API_KEY}
      - PINECONE_INDEX=${PINECONE_INDEX}
      - COHERE_API_KEY=${COHERE_API_KEY}
      - SECRET_KEY=${SECRET_KEY}
      - ENVIRONMENT=production
      - ALLOWED_ORIGINS=http://localhost:3000,https://yourdomain.com
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mongo:
        condition: service_started
    volumes:
      - ./logs:/app/logs
    networks:
      - edni_network

  # ── Next.js Frontend ─────────────────────────────────────────────────────────
  frontend:
    build:
      context: ../edni-frontend     # path to your Next.js project
      dockerfile: Dockerfile.frontend
    container_name: edni_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://api:8000/api/v1
      - NEXT_PUBLIC_APP_NAME=Edni AI
    depends_on:
      - api
    networks:
      - edni_network

  # ── PostgreSQL ───────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: edni_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER:     edni
      POSTGRES_PASSWORD: edni_pass
      POSTGRES_DB:       edni_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U edni -d edni_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - edni_network

  # ── Redis (caching) ──────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: edni_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - edni_network

  # ── MongoDB (logging) ─────────────────────────────────────────────────────────
  mongo:
    image: mongo:7
    container_name: edni_mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: edni_logs
    volumes:
      - mongo_data:/data/db
    networks:
      - edni_network

  # ── Nginx reverse proxy ───────────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: edni_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - api
      - frontend
    networks:
      - edni_network

volumes:
  postgres_data:
  redis_data:
  mongo_data:

networks:
  edni_network:
    driver: bridge
